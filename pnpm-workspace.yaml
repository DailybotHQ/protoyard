packages:
  - apps/*
  - packages/*
  - templates/*
  - prototypes/*

# Supply-chain guard: only install package versions published at least 3 days
# ago (4320 minutes). Protects against compromised releases that get yanked or
# patched within days. Affects new installs and updates; the lockfile is honored.
minimumReleaseAge: 4320

allowBuilds:
  # Native bindings / install scripts that pnpm would otherwise refuse to run.
  esbuild: true
  '@biomejs/biome': true
  '@parcel/watcher': true
  sharp: true
  unrs-resolver: true

# Several agents may run scripts concurrently; never let `pnpm run` trigger an
# implicit install (that rewrites the shared lockfile). Install explicitly.
verifyDepsBeforeRun: false
