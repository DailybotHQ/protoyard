name: ci

# Every pull request and every push to main: public hygiene, lint, types,
# unit tests, the gallery build, a scoped build + export of the reference
# prototype, Playwright E2E (Chromium only) against real static builds, and
# the performance budgets job (bundle + index + scenario generation gates;
# cold-start reported only).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.20.0'
  # Prototypes smoke-tested in E2E (comma-separated). Override with the
  # repository variable PROTOYARD_E2E_PROTOTYPES.
  E2E_PROTOTYPES: ${{ vars.PROTOYARD_E2E_PROTOTYPES || 'crm-demo,mobile-banking-demo,ai-chat-demo' }}

jobs:
  hygiene:
    name: public hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Public-hygiene check (tracked files, no network)
        run: bash scripts/check-public-hygiene.sh

  check:
    name: lint, types, tests, builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm (corepack, version from packageManager)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Index manifests
        run: pnpm protoyard index
      - name: Doctor
        run: pnpm protoyard doctor --offline
      - name: Build the gallery (astro check + build)
        run: pnpm --filter @protoyard/gallery build
      - name: Build and export the reference prototype
        run: |
          if [ -d prototypes/crm-demo ]; then
            pnpm protoyard validate crm-demo --skip-typecheck
            pnpm protoyard export crm-demo
            pnpm protoyard publish crm-demo --provider cloudflare --dry-run
          else
            echo "prototypes/crm-demo does not exist yet; skipping."
          fi
      - name: Upload the exported ZIP
        if: ${{ hashFiles('artifacts/crm-demo/crm-demo.zip') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crm-demo-export
          path: |
            artifacts/crm-demo/crm-demo.zip
            artifacts/crm-demo/build-manifest.json
          retention-days: 7

  e2e:
    name: e2e (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm (corepack, version from packageManager)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies (cached browser)
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Select existing prototype targets
        run: |
          targets=""
          for slug in $(echo "$E2E_PROTOTYPES" | tr ',' ' '); do
            if [ -d "prototypes/$slug" ]; then targets="${targets:+$targets,}$slug"; fi
          done
          echo "PROTOYARD_E2E_PROTOTYPES=$targets" >> "$GITHUB_ENV"
          echo "E2E prototype targets: ${targets:-none}"
      - name: Playwright (gallery, prototype builds and the showcase site)
        run: pnpm test:e2e
        env:
          PROTOYARD_E2E_SHOWCASE: '1'
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Bundle, index and scenario generation budgets. Cold-start is reported only
  # (not a gate) until CI runners are calibrated against coldStartMs.
  perf:
    name: performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm (corepack, version from packageManager)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare report directory
        run: mkdir -p artifacts/perf tmp
      - name: Build all prototypes
        run: pnpm protoyard build --all
      - name: Bundle size budgets
        # --silent keeps pnpm from prefixing the JSON envelope with the script line.
        run: pnpm --silent protoyard budget --all --skip-build --json > artifacts/perf/budget.json
      - name: Index scale budget (1,000 manifests)
        run: pnpm bench:index --runs 3 --check
      - name: Scenario generation budgets (default scenarios)
        run: |
          set -euo pipefail
          mapfile -t slugs < <(
            pnpm --silent protoyard list --kind prototype --json | node -e '
              let s = "";
              process.stdin.on("data", (c) => (s += c));
              process.stdin.on("end", () => {
                const body = JSON.parse(s);
                const entries = body?.data?.entries ?? body?.entries ?? [];
                for (const e of entries) {
                  if (e && e.kind === "prototype" && typeof e.slug === "string") console.log(e.slug);
                }
              });
            '
          )
          if [ "${#slugs[@]}" -eq 0 ]; then
            echo "No prototypes indexed; skipping scenario bench."
            exit 0
          fi
          for slug in "${slugs[@]}"; do
            echo "::group::scenario bench ${slug}"
            pnpm --silent protoyard scenario bench "$slug" --check --json \
              > "artifacts/perf/scenario-bench-${slug}.json"
            echo "::endgroup::"
          done
      - name: Cold-start bench (report only — not a gate yet)
        # Runner variance is unknown; gate after a calibration run (open question).
        # Always upload numbers; do not fail the job on cold-start thresholds.
        continue-on-error: true
        run: |
          set -euo pipefail
          mapfile -t slugs < <(
            pnpm --silent protoyard list --kind prototype --json | node -e '
              let s = "";
              process.stdin.on("data", (c) => (s += c));
              process.stdin.on("end", () => {
                const body = JSON.parse(s);
                const entries = body?.data?.entries ?? body?.entries ?? [];
                for (const e of entries) {
                  if (e && e.kind === "prototype" && typeof e.slug === "string") console.log(e.slug);
                }
              });
            '
          )
          if [ "${#slugs[@]}" -eq 0 ]; then
            echo "No prototypes to cold-start."
            exit 0
          fi
          pnpm exec tsx scripts/bench-cold-start.ts "${slugs[@]}" --runs 3 \
            | tee artifacts/perf/cold-start.txt
      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-reports-${{ github.run_id }}
          path: |
            artifacts/perf/
            tmp/bench-index-*.json
            tmp/bench-cold-start-*.json
          if-no-files-found: warn
          retention-days: 14
