name: ci

# Every pull request and every push to main, in parallel jobs of about five
# minutes each: public hygiene; lint and repo checks (docs, skill, index,
# doctor, the gallery build and the reference export); types in three shards;
# the essential unit suite in two shards; Playwright E2E in two shards against
# real static builds; the performance budgets (bundle, index and scenario
# generation; cold-start reported only); and the packages job (build, lint and
# install the publishable packages from their tarballs; the npm consumer
# variant runs on main only). The pnpm store and the built packages are cached.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.20.0'

jobs:
  hygiene:
    name: public hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Public-hygiene check (tracked files, no network)
        run: bash scripts/check-public-hygiene.sh

  # Lint and the fast repository checks (docs, skill, integrations, index,
  # doctor, the gallery build and the reference prototype export).
  lint:
    name: lint and repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm (corepack, version from packageManager)
        run: corepack enable
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm lint
      - name: Skill frontmatter and CLI alignment
        run: pnpm check:skill
      - name: Integration recipes match the CLI
        run: pnpm check:integrations
      - name: Public guides and their links
        run: pnpm check:docs
      - name: Index manifests
        run: pnpm protoyard index
      - name: Doctor
        run: pnpm protoyard doctor --offline
      - name: Build the gallery (astro check + build)
        run: pnpm --filter @protoyard/gallery build
      - name: Build and export the reference prototype
        run: |
          if [ -d prototypes/crm-demo ]; then
            pnpm protoyard validate crm-demo --skip-typecheck
            pnpm protoyard export crm-demo
            pnpm protoyard publish crm-demo --provider cloudflare --dry-run
          else
            echo "prototypes/crm-demo does not exist yet; skipping."
          fi

  # svelte-check over 80+ workspace projects, split into three parallel shards.
  typecheck:
    name: types (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: packages
            filters: --filter "./packages/**"
          - name: prototypes
            filters: --filter "./prototypes/**"
          - name: templates and apps
            filters: --filter "./templates/**" --filter "./apps/**"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm (corepack, version from packageManager)
        run: corepack enable
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r --workspace-concurrency=4 --if-present ${{ matrix.filters }} typecheck

  # The essential unit suite in two shards. Some tests read the built packages
  # and the prebuilt player, so dist is cached on every build input.
  unit:
    name: unit tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm (corepack, version from packageManager)
        run: corepack enable
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache the built packages
        id: dist
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/*/dist
          key: unit-dist-${{ runner.os }}-${{ hashFiles('packages/**', '!packages/*/dist/**', '!**/node_modules/**', 'templates/**', 'blueprints/**', 'scripts/build-packages.ts', 'scripts/lib/package-graph.ts', 'tsconfig.base.json', 'pnpm-lock.yaml') }}
      - name: Build the packages and the player
        if: steps.dist.outputs.cache-hit != 'true'
        run: pnpm build:packages && pnpm --filter @protoyard/player build
      - name: Unit tests
        run: pnpm vitest run --shard=${{ matrix.shard }}/2

  # Split by the servers each group builds (every webServer builds its target
  # first), so no job builds what it does not test. Specs whose target is off
  # skip themselves.
  e2e:
    name: e2e (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: site
            gallery: '1'
            site: '1'
            prototypes: ''
            devtools: ''
            comments: ''
          - group: apps 1
            gallery: '1'
            site: ''
            prototypes: crm-demo,mobile-banking-demo,ai-chat-demo
            devtools: mobile-banking-demo
            comments: ''
          - group: apps 2
            gallery: '0'
            site: ''
            prototypes: lattice-saas-demo,ui-kit,doc
            devtools: ''
            comments: crm-demo,mobile-banking-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm (corepack, version from packageManager)
        run: corepack enable
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies (cached browser)
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Select existing prototype targets
        env:
          E2E_GROUP_PROTOTYPES: ${{ matrix.prototypes }}
        run: |
          targets=""
          for slug in $(echo "$E2E_GROUP_PROTOTYPES" | tr ',' ' '); do
            if [ -d "prototypes/$slug" ] || [ -d "templates/$slug" ]; then targets="${targets:+$targets,}$slug"; fi
          done
          echo "PROTOYARD_E2E_PROTOTYPES=$targets" >> "$GITHUB_ENV"
          echo "E2E prototype targets: ${targets:-none}"
      - name: Playwright (${{ matrix.group }})
        run: pnpm test:e2e
        env:
          PROTOYARD_E2E_GALLERY: ${{ matrix.gallery }}
          PROTOYARD_E2E_SHOWCASE: ${{ matrix.site }}
          PROTOYARD_E2E_DECK: ${{ matrix.site }}
          PROTOYARD_E2E_PLAYER: ${{ matrix.site }}
          PROTOYARD_E2E_QUICK: ${{ matrix.site || matrix.devtools && '1' || '' }}
          PROTOYARD_E2E_DEVTOOLS_PROTOTYPES: ${{ matrix.devtools }}
          PROTOYARD_E2E_COMMENTS_PROTOTYPES: ${{ matrix.comments }}
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Bundle, index and scenario generation budgets. Cold-start is reported only
  # (not a gate) until CI runners are calibrated against coldStartMs.
  perf:
    name: performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm (corepack, version from packageManager)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare report directory
        run: mkdir -p artifacts/perf tmp
      - name: Build all prototypes
        run: pnpm protoyard build --all
      - name: Bundle size budgets
        # --silent keeps pnpm from prefixing the JSON envelope with the script line.
        run: pnpm --silent protoyard budget --all --skip-build --json > artifacts/perf/budget.json
      - name: Index scale budget (1,000 manifests)
        run: pnpm bench:index --runs 3 --check
      - name: Scenario generation budgets (default scenarios)
        run: |
          set -euo pipefail
          mapfile -t slugs < <(
            pnpm --silent protoyard list --kind prototype --json | node -e '
              let s = "";
              process.stdin.on("data", (c) => (s += c));
              process.stdin.on("end", () => {
                const body = JSON.parse(s);
                const entries = body?.data?.entries ?? body?.entries ?? [];
                for (const e of entries) {
                  if (e && e.kind === "prototype" && typeof e.slug === "string") console.log(e.slug);
                }
              });
            '
          )
          if [ "${#slugs[@]}" -eq 0 ]; then
            echo "No prototypes indexed; skipping scenario bench."
            exit 0
          fi
          for slug in "${slugs[@]}"; do
            echo "::group::scenario bench ${slug}"
            pnpm --silent protoyard scenario bench "$slug" --check --ci-factor 3 --json \
              > "artifacts/perf/scenario-bench-${slug}.json"
            echo "::endgroup::"
          done
      - name: Cold-start bench (report only — not a gate yet)
        # Runner variance is unknown; gate after a calibration run (open question).
        # Always upload numbers; do not fail the job on cold-start thresholds.
        continue-on-error: true
        run: |
          set -euo pipefail
          mapfile -t slugs < <(
            pnpm --silent protoyard list --kind prototype --json | node -e '
              let s = "";
              process.stdin.on("data", (c) => (s += c));
              process.stdin.on("end", () => {
                const body = JSON.parse(s);
                const entries = body?.data?.entries ?? body?.entries ?? [];
                for (const e of entries) {
                  if (e && e.kind === "prototype" && typeof e.slug === "string") console.log(e.slug);
                }
              });
            '
          )
          if [ "${#slugs[@]}" -eq 0 ]; then
            echo "No prototypes to cold-start."
            exit 0
          fi
          pnpm exec tsx scripts/bench-cold-start.ts "${slugs[@]}" --runs 3 \
            | tee artifacts/perf/cold-start.txt
      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-reports-${{ github.run_id }}
          path: |
            artifacts/perf/
            tmp/bench-index-*.json
            tmp/bench-cold-start-*.json
          if-no-files-found: warn
          retention-days: 14

  # The publishable packages: build their dist, prove dist parity, lint the
  # packed tarballs (every package publish-ready) and install them in a clean
  # consumer. The pnpm store and the built dist are cached; dist is keyed on
  # every build input, so a cache hit skips only an identical rebuild.
  packages:
    name: packages (build, lint; tarball install on main)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm (corepack, version from packageManager)
        run: corepack enable
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache the built packages
        id: dist
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/*/dist
          key: packages-dist-${{ runner.os }}-${{ hashFiles('packages/**', '!packages/*/dist/**', '!**/node_modules/**', 'templates/**', 'blueprints/**', 'scripts/build-packages.ts', 'scripts/lib/package-graph.ts', 'tsconfig.base.json', 'pnpm-lock.yaml') }}
      - name: Build the packages
        if: steps.dist.outputs.cache-hit != 'true'
        run: pnpm build:packages
      - name: Dist parity and the prebuilt player (skipped without dist)
        run: pnpm vitest run packages/cli/tests/package-dist-parity.test.ts packages/cli/tests/quick-player-assets.test.ts
      - name: Lint the packed packages (every one publish-ready)
        run: |
          set -o pipefail
          mkdir -p artifacts/packages
          pnpm --silent check:packages --require-all --json | tee artifacts/packages/check-packages.json
      - name: Install the tarballs in a clean consumer (pnpm, main only)
        # About 3.5 minutes; it runs on every push to main and again in
        # release.yml before anything is published, so pull requests skip it.
        if: github.event_name == 'push'
        run: pnpm verify:packages
      - name: Upload the package check report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-check-report
          path: artifacts/packages/
          if-no-files-found: warn
          retention-days: 7

  # The same tarball install with npm (default peer handling), on main only:
  # it adds about two minutes and rarely differs from pnpm on a pull request.
  packages-npm:
    name: packages (npm consumer)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm (corepack, version from packageManager)
        run: corepack enable
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache the built packages
        id: dist
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/*/dist
          key: packages-dist-${{ runner.os }}-${{ hashFiles('packages/**', '!packages/*/dist/**', '!**/node_modules/**', 'templates/**', 'blueprints/**', 'scripts/build-packages.ts', 'scripts/lib/package-graph.ts', 'tsconfig.base.json', 'pnpm-lock.yaml') }}
      - name: Build the packages
        if: steps.dist.outputs.cache-hit != 'true'
        run: pnpm build:packages
      - name: Install the tarballs in a clean consumer (npm)
        run: |
          set -o pipefail
          mkdir -p artifacts/packages
          pnpm verify:packages --pm npm 2>&1 | tee artifacts/packages/verify-npm.txt
      - name: Upload the npm consumer report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-npm-report
          path: artifacts/packages/
          if-no-files-found: warn
          retention-days: 7
