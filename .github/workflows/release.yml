name: release

# Every release is published by CI, with no manual step. After `ci` passes on a
# push to main (or on a manual run from main):
# 0. plan: reads the lockstep version from package.json. When that version is
#    already on npm there is nothing to release and every job below is
#    skipped, so an ordinary merge publishes nothing. Releasing means merging
#    the version bump (`pnpm version-packages`).
# 1. gate: the full gate on the exact commit CI tested: the version has a
#    CHANGELOG.md section, and the packages build, lint (every one
#    publish-ready) and install from their tarballs.
#    The gate then packs every public package with pnpm in dependency order,
#    writes the tarballs' SHA256SUMS and uploads both as one artifact.
# 2. npm: downloads that artifact, verifies the checksums and publishes each
#    tarball with npm Trusted Publishing (OIDC, --provenance) in order. It has
#    no source checkout, no install and no build, so no package script runs
#    while it holds the OIDC token. There is no npm token secret. A
#    prerelease version publishes under the `next` dist-tag.
#    Each publish retries a transient failure and never publishes twice; a
#    last step checks every package's dist-tag on the registry.
#    The `npm` environment admits only main, and npm trusts only this
#    workflow with that environment, so no other branch can publish.
# 3. release: tags the commit `v<version>` and creates the GitHub Release.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only after CI passed on a push to main, or a manual run on main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main')
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI tested; the triggering ref on a manual run.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
      - name: Is this version already on npm?
        id: plan
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # create-protoyard is published last, so it is on npm only when the
          # whole release is; a partial release runs again and skips the rest.
          if npm view "create-protoyard@$version" version > /dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Protoyard $version is already on npm; nothing to release."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing Protoyard $version from $SHA."
          fi

  gate:
    name: gate
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
      - name: Enable pnpm (corepack, version from packageManager)
        run: corepack enable
      - name: The version has a changelog section
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: bash scripts/changelog-section.sh "$VERSION" > /dev/null
      - name: No pending changesets (the release comes after version-packages)
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | sort)
          if [ -n "$pending" ]; then
            echo "Unreleased changesets remain; run pnpm version-packages before tagging:" >&2
            echo "$pending" >&2
            exit 1
          fi
      - name: Public-hygiene check
        run: bash scripts/check-public-hygiene.sh
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Skill versions match the release tag
        env:
          TAG: v${{ needs.plan.outputs.version }}
        run: |
          version=${TAG#v}
          pnpm exec tsx scripts/stamp-skill-version.ts "$version" --check
      - name: The skill matches the committed SHA256SUMS
        run: bash scripts/verify-skill-integrity.sh
      - name: Smoke-install the skill at the release commit
        env:
          TAG: v${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: bash scripts/smoke-install-skill.sh "$TAG" "$SHA"
      - name: Every public package is on the lockstep version
        run: pnpm version-packages --check
      - name: Lint, types, unit tests
        run: pnpm check
      - name: Build the packages
        run: pnpm build:packages
      - name: Lint the packed packages (every one publish-ready)
        run: pnpm check:packages --require-all
      - name: Install the tarballs in a clean consumer
        run: pnpm verify:packages
      - name: Pack every public package in dependency order
        env:
          TARBALLS: ${{ runner.temp }}/tarballs
        run: |
          set -euo pipefail
          mkdir -p "$TARBALLS"
          : > "$TARBALLS/order.tsv"
          # pnpm -r runs in topological order, and one at a time keeps the list
          # ordered. Each package packs into its own folder, because pack
          # lifecycle scripts may print to stdout. Paths are relative to
          # $TARBALLS, so the list still holds after the artifact moves.
          pnpm -r --filter "./packages/**" --filter "./apps/gallery" --workspace-concurrency=1 \
            exec sh -c 'd=$(mktemp -d "$TARBALLS/pack.XXXXXX") && pnpm pack --pack-destination "$d" >&2 && set -- "$d"/*.tgz && test "$#" -eq 1 && test -f "$1" && printf "%s\t%s\n" "$(jq -r "[.name, .version] | @tsv" package.json)" "${1#"$TARBALLS"/}" >> "$TARBALLS/order.tsv"'
          cat "$TARBALLS/order.tsv"
      - name: Checksum the tarballs
        env:
          TARBALLS: ${{ runner.temp }}/tarballs
        run: |
          set -euo pipefail
          cd "$TARBALLS"
          : > SHA256SUMS
          while IFS="$(printf '\t')" read -r name version file; do
            shasum -a 256 -- "$file" >> SHA256SUMS
          done < order.tsv
          shasum -a 256 -- order.tsv >> SHA256SUMS
          cat SHA256SUMS
      - name: Upload the tarballs for the npm job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/tarballs
          if-no-files-found: error
          retention-days: 7
      - name: Build the gallery
        run: pnpm --filter @protoyard/gallery build
      - name: Build every prototype
        run: |
          pnpm protoyard index
          pnpm protoyard build --all

  npm:
    name: npm publish
    needs: [plan, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    # No checkout, install, build or pack here: this job only publishes the
    # tarballs the gate packed and checksummed, so no package script runs
    # while it holds the OIDC token.
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          registry-url: 'https://registry.npmjs.org'
      - name: npm supports Trusted Publishing (11.5.1 or later)
        run: |
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error(`npm ${process.argv[1]} is too old for Trusted Publishing`);
              process.exit(1);
            }' "$(npm --version)"
      - name: Download the gate's tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/tarballs
      - name: Verify the tarball checksums
        env:
          TARBALLS: ${{ runner.temp }}/tarballs
        run: |
          set -euo pipefail
          cd "$TARBALLS"
          # Every file the list names must be listed in SHA256SUMS, stay
          # inside this folder, and match its checksum.
          listed() { F="$1" awk 'substr($0, 67) == ENVIRON["F"] { found = 1 } END { exit !found }' SHA256SUMS; }
          listed order.tsv || { echo "order.tsv is not in SHA256SUMS" >&2; exit 1; }
          shasum -a 256 -c SHA256SUMS
          count=0
          while IFS="$(printf '\t')" read -r name version file; do
            case "$file" in
              '' | /* | *..*) echo "Unsafe tarball path for $name: $file" >&2; exit 1 ;;
            esac
            listed "$file" || { echo "$file is not in SHA256SUMS" >&2; exit 1; }
            count=$((count + 1))
          done < order.tsv
          [ "$count" -gt 0 ] || { echo "No tarballs to publish" >&2; exit 1; }
          [ "$(wc -l < SHA256SUMS)" -eq "$((count + 1))" ] || { echo "SHA256SUMS lists files the order does not" >&2; exit 1; }
          echo "Verified $count tarballs."
      - name: Publish with provenance
        env:
          TAG: v${{ needs.plan.outputs.version }}
          TARBALLS: ${{ runner.temp }}/tarballs
        run: |
          set -euo pipefail
          dist_tag=latest
          case "$TAG" in *-*) dist_tag=next ;; esac
          # Pre-flight: every tarball is the tagged version (lockstep), so a
          # wrong artifact stops here, before the first publish.
          while IFS="$(printf '\t')" read -r name version file; do
            [ "v$version" = "$TAG" ] || { echo "$name is $version, not ${TAG#v}" >&2; exit 1; }
          done < "$TARBALLS/order.tsv"
          published() { npm view "$1@$2" version > /dev/null 2>&1; }
          # The order is dependencies first, so a stop midway never leaves a
          # published package pointing at a missing version.
          while IFS="$(printf '\t')" read -r name version file; do
            # A rerun after a partial failure skips what is already published.
            if published "$name" "$version"; then
              echo "skip $name@$version (already published)"
              continue
            fi
            tarball="$TARBALLS/$file"
            # The OIDC token read can fail transiently (Texuli saw
            # IDENTITY_TOKEN_READ_ERROR), so retry; a failed attempt may still
            # have landed, so check before trying again and never publish twice.
            ok=0
            for attempt in 1 2 3; do
              if npm publish "$tarball" --provenance --access public --tag "$dist_tag"; then ok=1; break; fi
              if published "$name" "$version"; then ok=1; break; fi
              echo "attempt $attempt for $name@$version failed; retrying" >&2
              sleep $((attempt * 15))
            done
            [ "$ok" = 1 ] || { echo "could not publish $name@$version" >&2; exit 1; }
          done < "$TARBALLS/order.tsv"
      - name: Verify every package on the registry
        env:
          TAG: v${{ needs.plan.outputs.version }}
          TARBALLS: ${{ runner.temp }}/tarballs
        run: |
          set -euo pipefail
          dist_tag=latest
          case "$TAG" in *-*) dist_tag=next ;; esac
          # Registry metadata can lag a minute or two, so retry for about
          # three minutes before failing.
          for attempt in $(seq 1 12); do
            missing=""
            while IFS="$(printf '\t')" read -r name version file; do
              [ "$(npm view "$name" "dist-tags.$dist_tag" 2>/dev/null)" = "$version" ] || missing="$missing $name"
            done < "$TARBALLS/order.tsv"
            [ -z "$missing" ] && { echo "Every package is $dist_tag ${TAG#v} on npm."; exit 0; }
            echo "waiting for:$missing"
            sleep 15
          done
          echo "Not on npm as $dist_tag ${TAG#v}:$missing" >&2
          exit 1

  release:
    name: GitHub Release
    needs: [plan, gate, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: The attached SHA256SUMS matches the skill
        run: bash scripts/verify-skill-integrity.sh
      - name: Tag the commit and create the release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          version=${TAG#v}
          bash scripts/changelog-section.sh "$version" > release-notes.md
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "Protoyard $TAG" \
            --notes-file release-notes.md --target "$SHA" $prerelease
