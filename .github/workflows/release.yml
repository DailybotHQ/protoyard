name: release

# On a version tag (v0.1.0, v1.2.3-rc.1…): run the full gate, check the tag
# matches package.json and has a CHANGELOG.md section, then create a GitHub
# Release with that section as notes. Nothing is published to npm.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.20.0'
      - name: Enable pnpm (corepack, version from packageManager)
        run: corepack enable
      - name: Tag matches package.json and the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
          bash scripts/changelog-section.sh "$version" > /dev/null
      - name: Public-hygiene check
        run: bash scripts/check-public-hygiene.sh
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint, types, unit tests
        run: pnpm check
      - name: Build the gallery
        run: pnpm --filter @protoyard/gallery build
      - name: Build every prototype
        run: |
          pnpm protoyard index
          pnpm protoyard build --all

  release:
    name: GitHub Release
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          bash scripts/changelog-section.sh "$version" > release-notes.md
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Protoyard $TAG" \
            --notes-file release-notes.md --verify-tag $prerelease
