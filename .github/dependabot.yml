# GitHub Actions weekly (SHA pins are bumped with their version comment), plus
# the npm ecosystem (pnpm lockfile). pnpm's minimumReleaseAge
# (pnpm-workspace.yaml) still gates what installs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: [dependencies]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Types must describe the Node we support (engines: >=24.20, CI on 24.20):
      # @types/node 25+ would type APIs that do not exist on Node 24. Minor and
      # patch updates of 24.x still arrive. Raise this together with engines.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
    labels: [dependencies]
