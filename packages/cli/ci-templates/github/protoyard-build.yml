# protoyard-ci-template: build v4
name: Protoyard affected builds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protoyard-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '{{NODE_VERSION}}'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Each prototype is built once; export and budget reuse that build.
      - name: Validate, export and check budgets of affected prototypes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          targets="$(pnpm protoyard affected --since "origin/${GITHUB_BASE_REF}" --format csv)"
          if [[ -z "$targets" ]]; then
            echo 'No affected prototypes.'
            exit 0
          fi
          IFS=',' read -r -a slugs <<< "$targets"
          for slug in "${slugs[@]}"; do
            pnpm protoyard validate "$slug" --build
            pnpm protoyard export "$slug" --skip-build
            pnpm protoyard budget "$slug" --skip-build
          done
      - name: Build, export and check budgets of all prototypes on main
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        run: |
          pnpm protoyard build --all
          pnpm protoyard export --all --skip-build
          pnpm protoyard budget --all --skip-build
      # Prototypes locked to a design system (designSystem.locked) must also
      # pass the render check in Chromium; it reuses the fresh builds above.
      - name: Find locked prototypes
        id: locked
        shell: bash
        run: |
          slugs="$(pnpm --silent protoyard check ds --report --json | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>process.stdout.write(JSON.parse(s).data.prototypes.filter(p=>p.locked).map(p=>p.slug).join(",")))')"
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "Locked prototypes: ${slugs:-none}"
      - name: Resolve the Playwright version
        id: playwright
        if: steps.locked.outputs.slugs != ''
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        if: steps.locked.outputs.slugs != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.locked.outputs.slugs != '' && steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies (cached browser)
        if: steps.locked.outputs.slugs != '' && steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Render check of locked prototypes (required for them)
        if: steps.locked.outputs.slugs != ''
        run: pnpm protoyard check ds --render
      - name: Upload exported ZIPs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: protoyard-exports-${{ github.run_id }}
          path: artifacts/*/*.zip
          if-no-files-found: ignore
          retention-days: 7
