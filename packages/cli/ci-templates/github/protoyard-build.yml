# protoyard-ci-template: build v1
name: Protoyard affected builds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protoyard-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '{{NODE_VERSION}}'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate and export affected prototypes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          targets="$(pnpm protoyard affected --since "origin/${GITHUB_BASE_REF}" --format csv)"
          if [[ -z "$targets" ]]; then
            echo 'No affected prototypes.'
            exit 0
          fi
          IFS=',' read -r -a slugs <<< "$targets"
          for slug in "${slugs[@]}"; do
            pnpm protoyard validate "$slug" --build
            pnpm protoyard export "$slug"
          done
      - name: Validate and export all prototypes on main
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        run: |
          pnpm protoyard build --all
          pnpm protoyard export --all
      - name: Enforce performance budgets
        run: pnpm protoyard budget --all
      - name: Upload exported ZIPs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: protoyard-exports-${{ github.run_id }}
          path: artifacts/*/*.zip
          if-no-files-found: ignore
          retention-days: 7
