# protoyard-ci-template: preview v2
#
# Every run uploads a public *.pages.dev PREVIEW for each affected prototype
# (publish without --dry-run deploys immediately; production is never used).
#
# Secrets: the publish step builds this pull request's own code with the token
# in its environment, so anyone who can push a branch here can read it.
#   - Use a Cloudflare API token limited to "Account > Cloudflare Pages: Edit"
#     on one account, never a global key.
#   - Store CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as secrets of the
#     "protoyard-preview" environment (Settings > Environments) with required
#     reviewers, so each run waits for approval before it sees them.
#   - Rotate the token when collaborators change.
name: Protoyard Cloudflare preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: protoyard-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '{{NODE_VERSION}}'

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: protoyard-preview
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Wrangler (pinned)
        run: |
          npm install --global wrangler@4.146.0
          wrangler --version
      - name: Publish affected prototypes to preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          targets="$(pnpm protoyard affected --since "origin/${GITHUB_BASE_REF}" --format csv)"
          if [[ -z "$targets" ]]; then
            echo 'No affected prototypes to preview.'
            exit 0
          fi
          IFS=',' read -r -a slugs <<< "$targets"
          for slug in "${slugs[@]}"; do
            pnpm protoyard publish "$slug" --provider {{PROVIDER}} --branch "pr-${PULL_REQUEST_NUMBER}" --ensure-project --yes
          done
