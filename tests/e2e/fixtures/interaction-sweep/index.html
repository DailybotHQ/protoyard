<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interaction sweep fixture</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
        line-height: 1.5;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin: 1rem 0;
      }
      button,
      a {
        font: inherit;
        padding: 0.5rem 0.75rem;
      }
      .display {
        padding: 0.75rem;
        border: 1px solid #ccc;
        border-radius: 0.5rem;
        max-width: 24rem;
      }
      #status[data-state='on'] {
        background: #dcfce7;
      }
    </style>
  </head>
  <body>
    <h1>Interaction sweep fixture</h1>
    <p id="status" data-state="off" data-testid="status">Status: off</p>
    <div class="row">
      <button type="button" id="live-btn" data-testid="live-control">Toggle status</button>
      <button type="button" id="dead-btn" data-testid="dead-control">Looks clickable</button>
      <a id="hash-link" href="#panel">Open panel</a>
    </div>
    <div class="display" data-testid="display-block" aria-label="Read-only summary">
      Display-only block. Not a control. The sweep must skip or ignore this.
    </div>
    <section id="panel" hidden data-testid="panel">
      <h2>Panel</h2>
      <p>Hash navigation opened this panel.</p>
    </section>
    <script type="module">
      const status = document.getElementById('status');
      const live = document.getElementById('live-btn');
      const dead = document.getElementById('dead-btn');
      const panel = document.getElementById('panel');
      live?.addEventListener('click', () => {
        const on = status?.getAttribute('data-state') === 'on';
        status?.setAttribute('data-state', on ? 'off' : 'on');
        if (status) status.textContent = on ? 'Status: off' : 'Status: on';
      });
      // Deliberately inert — no listener.
      void dead;
      const syncHash = () => {
        if (panel) panel.hidden = location.hash !== '#panel';
      };
      window.addEventListener('hashchange', syncHash);
      syncHash();
    </script>
  </body>
</html>
